
plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.35.0'
}

// Publishing to Maven Central via the vanniktech plugin
//
// To publish, run: ./gradlew publishToMavenCentral
//
// Credentials setup:
// 1. Create account at https://central.sonatype.com
// 2. Migrate your namespace at https://central.sonatype.com/publishing/namespaces
// 3. Generate a user token at https://central.sonatype.com/account
// 4. Add to ~/.gradle/gradle.properties:
//        mavenCentralUsername=<token-username>
//        mavenCentralPassword=<token-password>
//
// For GPG signing, add to ~/.gradle/gradle.properties:
//        signing.keyId=<last-8-chars-of-key-id>
//        signing.password=<key-passphrase>
//        signing.secretKeyRingFile=<path-to-secring.gpg>
//
// Or use in-memory signing with environment variables:
//        ORG_GRADLE_PROJECT_signingInMemoryKey=<exported-key>
//        ORG_GRADLE_PROJECT_signingInMemoryKeyId=<key-id>
//        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=<passphrase>
//

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:1.7.35' // we were using 1.7.12 on 2022-02-03
    implementation 'com.miglayout:miglayout-swing:11.0'
    testImplementation 'junit:junit:4.13.2'
}
